; Workers de iopgps-webservices (reemplaza los bloques laravel-worker-*-iopgps actuales).
; Cada servicio tiene su propia cola para que uno lento no bloquee a los demás.
; --max-time recicla los workers cada hora (libera memoria y toma código nuevo).
; stopwaitsecs (600) debe ser mayor que el $timeout más alto de los jobs (240).

[program:laravel-worker-web-services-iopgps]
; ProcessUnitsJob es ShouldBeUnique: con 1 worker basta
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/iopgps-webservices/artisan queue:work --queue=web-services --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
numprocs=1
user=laradock
redirect_stderr=true
stdout_logfile=/var/www/iopgps-webservices/storage/logs/worker-web-services.log
stopwaitsecs=600

