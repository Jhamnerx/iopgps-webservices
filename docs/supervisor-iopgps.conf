[program:laravel-worker-iopgps]
; Cola default: ClearLogs y CheckDevicesExists (diarios). --timeout cubre OPTIMIZE TABLE.
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/iopgps-webservices/artisan queue:work --queue=default --sleep=3 --tries=1 --timeout=240 --max-time=3600
autostart=true
autorestart=true
numprocs=1
user=laradock
redirect_stderr=true
stdout_logfile=/var/www/iopgps-webservices/storage/logs/worker-default.log
stopwaitsecs=600
